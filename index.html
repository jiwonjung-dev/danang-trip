<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>다낭 두가족 겨울여행</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f4;--card:#fff;--ink:#1d2a2e;--sub:#5d6b70;--line:#d5dcdc;--teal:#1b6b7a;--tealbg:#dcedf0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#121a1c;--card:#1a2528;--ink:#e6eeee;--sub:#92a3a7;--line:#2e3d41;--teal:#5cb8c9;--tealbg:#1c3a40}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Noto Sans KR",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:28px 16px 48px}
h1{font:600 24px/1.3 "Noto Serif KR",serif;margin:0 0 4px}
.sub{color:var(--sub);font-size:13px;margin:0 0 20px}
a.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:12px;color:inherit;text-decoration:none}
a.card:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.tag{display:inline-block;background:var(--tealbg);color:var(--teal);font-size:12px;font-weight:700;border-radius:99px;padding:2px 10px}
a.card h2{font:600 18px/1.4 "Noto Serif KR",serif;margin:8px 0 4px}
a.card p{margin:0;color:var(--sub);font-size:13px}
a.card b{display:block;font-size:17px;margin-top:10px}
.go{color:var(--teal);font-size:13px;font-weight:700;margin-top:8px;display:block}
</style>
</head>
<body>
<main>
<h1>다낭 두가족 겨울여행</h1>
<p class="sub">2027년 1월 19일 ~ 23일 · 인천 출발 · 2가족 6명</p>
<a class="card" href="plan1.html"><span class="tag">1안</span><h2>신라 모노그램 3박</h2><p>아보라 0.5박 후 신라에서 3박. 온수풀과 키즈클럽을 마지막 날 아침까지 이용.</p><b>가족당 약 255~264만 원</b><span class="go">1안 보기 →</span></a>
<a class="card" href="plan2.html"><span class="tag">2안</span><h2>신라 2박 + 힐튼 다낭 1박</h2><p>마지막 밤은 시내 힐튼. 공항이 가깝고 용다리 불쇼 후 복귀가 짧음. 힐튼 요금은 추정치.</p><b>가족당 약 244~251만 원</b><span class="go">2안 보기 →</span></a>
</main>
</body>
</html>
